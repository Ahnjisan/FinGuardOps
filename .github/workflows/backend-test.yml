name: Backend Tests

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-test.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-test:
    name: Unit and web tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run unit and web tests
        id: backend_unit_tests
        run: ./gradlew test
      - name: Upload Backend unit test failure reports
        if: ${{ failure() && !cancelled() && steps.backend_unit_tests.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            backend/build/reports/tests/test/**
            backend/build/test-results/test/*.xml
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: false

  postgresql-integration-test:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run PostgreSQL integration tests
        id: backend_integration_tests
        run: ./gradlew integrationTest
      - name: Upload Backend PostgreSQL integration test failure reports
        if: ${{ failure() && !cancelled() && steps.backend_integration_tests.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            backend/build/reports/tests/integrationTest/**
            backend/build/test-results/integrationTest/*.xml
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: false
