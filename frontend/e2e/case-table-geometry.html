<!doctype html>
<!--
  TEST-ONLY BROWSER GEOMETRY FIXTURE. NOT PART OF THE APPLICATION.

  This page exists so a Chromium test can measure the production `CaseTable`
  component, styled by the production `app.css`, with rows actually in it. The
  E2E runtime seeds no fraud cases, so the real-Backend case test settles on a
  genuine empty 200 and cannot measure a populated sheet; rather than mock an
  API response to manufacture one - which would be evidence of nothing - the
  component is rendered directly against typed, fixed, synthetic rows.

  What this page is NOT:

  - not evidence of Backend integration. It makes no request of any kind.
  - not an API mock, a route interception or an authentication bypass. There is
    no network call here to intercept and no session to bypass.
  - not reachable from the application. It is not referenced by `index.html`,
    it is not a route in the production router, and `vite build` builds only
    `index.html`, so nothing here ships in `dist`.

  It loads exactly one module and nothing else: no external script, no font, no
  icon, no image, no stylesheet from anywhere but the application's own.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Case table geometry fixture (test only)</title>
  </head>

    <script type="module" src="/e2e/case-table-geometry.tsx"></script>
  </body>
