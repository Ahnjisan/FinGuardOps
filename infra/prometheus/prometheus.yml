global:
  scrape_interval: 15s
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - api_version: v2
      scheme: http
      timeout: 10s
      static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: finguardops-backend
    scheme: http
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - backend:8081
