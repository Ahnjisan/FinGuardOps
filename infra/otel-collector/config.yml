extensions:
  health_check:
    endpoint: 0.0.0.0:13133
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 192
    spike_limit_mib: 48
  filter/safe_logs:
    # Invalid/non-string bodies must fail closed rather than bypass the allowlist.
    error_mode: propagate
    logs:
      log_record:
        - 'not IsMatch(body, "^(event=ai_report_|event=ai_http_completed|Rule analysis)")'
  batch:
    timeout: 1s
    send_batch_size: 32
exporters:
  otlp_http/tempo:
    endpoint: http://tempo:4318
    timeout: 2s
    sending_queue:
      enabled: true
      queue_size: 128
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
    timeout: 2s
    sending_queue:
      enabled: true
      queue_size: 128
service:
  extensions: [health_check]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
                without_type_suffix: true
                without_units: true
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/tempo]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, filter/safe_logs, batch]
      exporters: [otlp_http/loki]
