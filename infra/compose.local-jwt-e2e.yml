services:
  local-jwt-fixture:
    image: python:3.12.11-slim-bookworm@sha256:519591d6871b7bc437060736b9f7456b8731f1499a57e22e6c285135ae657bf7
    entrypoint:
      - python
      - /opt/local-jwt-fixture/fixture.py
      - serve
    volumes:
      - ./local-jwt-fixture:/opt/local-jwt-fixture:ro
    network_mode: "service:backend"
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,os,stat,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8002/ready',timeout=2)) == {'status':'ready'}; mode=os.stat('/run/local-jwt/control.sock').st_mode; assert stat.S_ISSOCK(mode) and stat.S_IMODE(mode) == 0o600"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /run/local-jwt:rw,nosuid,nodev,noexec,size=4m,mode=0700,uid=10001,gid=10001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  backend:
    environment:
      SPRING_PROFILES_ACTIVE: local,external-risk-http,prometheus
      FINGUARDOPS_SECURITY_ISSUER: https://local-jwt.fixture.finguardops.invalid
      FINGUARDOPS_SECURITY_JWK_SET_URI: http://127.0.0.1:8002/oauth2/jwks
      FINGUARDOPS_SECURITY_INSECURE_LOOPBACK_JWK_ALLOWED: "true"
      FINGUARDOPS_SECURITY_JWK_CONNECT_TIMEOUT: 2s
      FINGUARDOPS_SECURITY_JWK_READ_TIMEOUT: 2s
