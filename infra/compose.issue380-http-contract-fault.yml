services:
  ml-http-contract-fault:
    image: python:3.12.11-slim-bookworm@sha256:519591d6871b7bc437060736b9f7456b8731f1499a57e22e6c285135ae657bf7
    entrypoint: [python, -B, /opt/local-jwt-fixture/ml_http_contract_fault.py]
    volumes:
      - ./local-jwt-fixture/ml_http_contract_fault.py:/opt/local-jwt-fixture/ml_http_contract_fault.py:ro
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [application]
  backend:
    environment:
      SPRING_APPLICATION_JSON: '{"finguardops":{"ml":{"base-url":"http://ml-http-contract-fault:8000"}}}'
