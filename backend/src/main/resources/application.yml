spring:
  kafka:
    bootstrap-servers: ${FINGUARDOPS_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
        max.block.ms: 5000
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
      properties:
        max.poll.interval.ms: 600000
    listener:
      ack-mode: manual_immediate
      missing-topics-fatal: false
  task:
    scheduling:
      pool:
        size: 3
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      data-source-properties:
        ApplicationName: finguardops-web
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

finguardops:
  kafka:
    enabled: ${FINGUARDOPS_KAFKA_ENABLED:false}
    consumer-enabled: ${FINGUARDOPS_KAFKA_CONSUMER_ENABLED:true}
    topic: finguardops.ai-report-execution-created.v1
    dlq-topic: finguardops.ai-report-execution-created.v1.dlq
    group-id: finguardops-ai-report-worker-v1
    outbox-poll-ms: 1000
    outbox-lease-seconds: 30
  ai-report:
    base-url: ${FINGUARDOPS_AI_SERVICE_BASE_URL:http://localhost:8000}
    poll-interval-ms: ${FINGUARDOPS_AI_REPORT_POLL_INTERVAL_MS:1000}
    lease-seconds: ${FINGUARDOPS_AI_REPORT_LEASE_SECONDS:300}
  security:
    issuer: ${FINGUARDOPS_SECURITY_ISSUER:https://issuer.example.invalid/finguardops}
    jwk-set-uri: ${FINGUARDOPS_SECURITY_JWK_SET_URI:https://issuer.example.invalid/.well-known/jwks.json}
    allowed-origins: ${FINGUARDOPS_SECURITY_ALLOWED_ORIGINS:}
    jwk-connect-timeout: ${FINGUARDOPS_SECURITY_JWK_CONNECT_TIMEOUT:2s}
    jwk-read-timeout: ${FINGUARDOPS_SECURITY_JWK_READ_TIMEOUT:2s}

management:
  endpoint:
    health:
      show-details: never
  endpoints:
    web:
      discovery:
        enabled: false
      exposure:
        include: "health"
  prometheus:
    metrics:
      export:
        enabled: false

logging:
  pattern:
    correlation: "[traceId=%X{traceId:-no-trace}] "
